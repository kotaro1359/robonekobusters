/* ================= 部屋コード方式（PeerJS：ブラウザ同士を直接つなぐ） =================
   ホストが4文字の部屋コードで部屋をつくり、仲間はコードを入れて参加する。
   通信はホストを中心にした星型：参加者→ホスト→ほかの参加者 の順に中継する。
   ゲーム側からは claude.ai の room と同じ形（peers / presence / emit / on）に見える。 */
const PJ={peer:null,host:0,code:'',me:null,hostId:'',conns:new Map(),hc:null,ps:new Map(),subs:{},myP:{},state:'idle',busy:0,leaving:0,ui:null,uiVis:null,sig:'',tf:'',msg:'',msgErr:0};

 const nx=()=>{if(i>=PJLIB.length)return rej(new Error('lib'));const s=document.createElement('script');s.src=PJLIB[i++];s.onload=()=>pjPeerClass()?res(pjPeerClass()):nx();s.onerror=nx;document.head.appendChild(s)};nx()})}
function pjCode(){let s='';for(let i=0;i<4;i++)s+=PJCH[Math.floor(Math.random()*PJCH.length)];return s}
function pjEnt(id,p){return Object.freeze({peer:id,by:null,isMe:id===PJ.me,sameTab:id===PJ.me,kind:'viewer',guest:false,presence:Object.freeze(p&&typeof p==='object'?p:{}),updatedAt:Date.now()})}
function pjSend(c,m){try{if(c&&c.open)c.send(m)}catch(e){}}
function pjBcast(m,ex){for(const c of PJ.conns.values())if(c.peer!==ex)pjSend(c,m)}
function pjDeliver(id,topic,data){for(const f of PJ.subs[topic]||[]){try{f({peer:id,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,topic,data})}catch(e){}}}
const PJROOM={peers:()=>[...PJ.ps.values()],
 presence(patch){const p=Object.assign({},PJ.myP);for(const k in patch){if(patch[k]===null)delete p[k];else p[k]=patch[k]}PJ.myP=p;if(PJ.me)PJ.ps.set(PJ.me,pjEnt(PJ.me,p));
  if(PJ.host)pjBcast({t:'p',id:PJ.me,p});else pjSend(PJ.hc,{t:'p',p});return Promise.resolve()},

/* ---- ホスト側：参加者の受け付けと中継 ---- */
function pjOnConn(c){c.on('open',()=>{if(PJ.state!=='open'){try{c.close()}catch(e){}return}
  if(!PJ.conns.has(c.peer)&&PJ.conns.size>=3){pjSend(c,{t:'full'});setTimeout(()=>{try{c.close()}catch(e){}},400);return}
  const old=PJ.conns.get(c.peer);PJ.conns.set(c.peer,c);if(old&&old!==c)try{old.close()}catch(e){}
  pjSend(c,{t:'hi',host:PJ.me});for(const e of PJ.ps.values())if(e.peer!==c.peer)pjSend(c,{t:'p',id:e.peer,p:e.presence})});

  if(m.t==='p'&&m.p&&typeof m.p==='object'){PJ.ps.set(c.peer,pjEnt(c.peer,m.p));pjBcast({t:'p',id:c.peer,p:m.p},c.peer)}
  else if(m.t==='e'&&typeof m.topic==='string'){pjDeliver(c.peer,m.topic,m.data);pjBcast({t:'e',id:c.peer,topic:m.topic,data:m.data},c.peer)}});

/* ---- 参加者側：ホストから届くもの ---- */
function pjOnHostData(m){if(!m||typeof m!=='object')return;

 else if(m.t==='e'&&typeof m.topic==='string'&&typeof m.id==='string')pjDeliver(m.id,m.topic,m.data)}
